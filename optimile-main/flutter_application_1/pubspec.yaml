name: flutter_application_1
description: A Flutter Maps & Directions project
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # File + CSV (stable with your code)
  file_picker: ^8.3.7
  csv: ^5.1.1

  http: ^1.1.0
  flutter_typeahead: ^5.2.0

  # Google Maps
  google_maps_flutter: ^2.5.0

  # Polyline decoding
  flutter_polyline_points: ^2.1.0
  geolocator: ^14.0.2
  uuid: ^4.4.0

  # Firebase (stable working combo)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12

  provider: ^6.1.5+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/data/deliveries.csv