# Render Blueprint: single web service (FastAPI + Flutter web app)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: optimile
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    # Ensure CSV and static files are present (build static/ locally before deploy)
